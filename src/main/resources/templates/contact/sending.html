<!doctype html>
<html lang="ja" layout:decorate="~{layout/layout}">
  <head>
    <meta
      name="description"
      layout:fragment="description"
      th:content="#{contact.sending.meta.description}"
    />
    <title layout:fragment="title" th:text="#{contact.sending.title}"></title>
  </head>
  <body>
    <main layout:fragment="content">
      <div class="mt-5 text-center">
        <h1 class="mb-4" th:text="#{contact.sending.heading}"></h1>
        <p>
          <span th:text="#{contact.sending.description.line1}"></span><br />
          <span th:text="#{contact.sending.description.line2}"></span>
        </p>
        <a th:href="@{/posts}" class="btn btn-primary" th:text="#{contact.sending.backToTop}"> </a>
      </div>
    </main>
  </body>
</html>
