# アプリケーション名
spring.application.name=bbs-test

# データベース設定（H2 + MySQL互換モード）
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# メール設定（ダミー）
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test-user
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ログ
logging.level.org.springframework.web=INFO
logging.level.com.example.bbs=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# セキュリティ設定
# 注意：本テストクラス内では直接使用しないが
# テスト環境の設定を完全に独立させるために、Hmac用ダミーキーを定義
hmac.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-at-least-32-chars